name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/**   # the deploy job's own commits don't need another release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Point the Kubernetes manifest at the image just published. Argo CD (see the
  # hugo-blog Application in cluster-ops) syncs deploy/ and rolls the pods.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, in case another release committed meanwhile

      - name: Set image tag in manifest
        run: |
          TAG="sha-${GITHUB_SHA::7}"   # matches docker/metadata-action's type=sha
          sed -i -E "s|(image: ${REGISTRY}/${IMAGE_NAME}):.*|\\1:${TAG}|" deploy/hugo-blog.yaml
          grep -q "image: ${REGISTRY}/${IMAGE_NAME}:${TAG}" deploy/hugo-blog.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "deploy: ${GITHUB_SHA::7}"
            git push origin HEAD:main
          }
