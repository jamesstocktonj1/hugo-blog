name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set image tag in manifest
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s|(image: ${REGISTRY}/${IMAGE_NAME}):.*|\\1:${TAG}|" deploy/hugo-blog.yaml
          grep -q "image: ${REGISTRY}/${IMAGE_NAME}:${TAG}" deploy/hugo-blog.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "deploy: ${GITHUB_SHA::7}"
            git push origin HEAD:main
          }

  sync:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: argocd-sync
      cancel-in-progress: false
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_OPTS: --grpc-web --insecure
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:cicd

      - name: Setup ArgoCD CLI
        run: |
          curl -fsSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 0755 argocd /usr/local/bin/argocd
          argocd version --client

      - name: Refresh hugo-blog app
        run: |
          argocd app get hugo-blog --hard-refresh > /dev/null

      - name: Wait for hugo-blog to be synced and healthy
        run: argocd app wait hugo-blog --sync --health --timeout 300

      - name: Application summary
        if: always()
        run: |
          argocd app get hugo-blog -o json > app.json
          {
            echo "## ArgoCD hugo-blog app"
            echo
            echo "| Application | Sync | Health | Revision |"
            echo "| --- | --- | --- | --- |"
            jq -r '"| \(.metadata.name) | \(.status.sync.status // "Unknown") | \(.status.health.status // "Unknown") | \((.status.sync.revision // "-")[0:7]) |"' app.json
          } >> "$GITHUB_STEP_SUMMARY"
